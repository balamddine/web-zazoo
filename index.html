<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zazoo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>Zazoo</h1>
    <span class="mood" id="mood">Loading…</span>
  </header>

  <div class="stats">
    <div class="stat"><label><span>Hunger</span><span id="vHunger"></span></label><div class="bar"><i id="bHunger"></i></div></div>
    <div class="stat"><label><span>Energy</span><span id="vEnergy"></span></label><div class="bar"><i id="bEnergy"></i></div></div>
    <div class="stat"><label><span>Happiness</span><span id="vHappy"></span></label><div class="bar"><i id="bHappy"></i></div></div>
    <div class="stat"><label><span>Weight</span><span id="vWeight"></span></label><div class="bar"><i id="bWeight"></i></div></div>
  </div>

  <div class="stage" id="stage">
    <div class="loading" id="loading">Loading Zazoo…</div>
    <canvas id="zazoo" width="960" height="960"></canvas>
    <div class="veil"></div>
    <canvas id="fx" width="720" height="720"></canvas>
    <div class="speech" id="speech"></div>
  </div>
  <div class="log" id="log">Tap Zazoo to play. Tap fast and he gets annoyed!</div>

  <div class="tray" id="tray"></div>

  <div class="actions">
    <button class="feed" id="btnFeed">Feed<small>pick food</small></button>
    <button class="play" id="btnPlay">Exercise<small>burn it off</small></button>
    <button class="kiss" id="btnKiss">Kiss<small>love</small></button>
    <button class="sleep" id="btnSleep">Sleep<small>lights off</small></button>
  </div>

  <div class="footer">
    <button class="chip" id="btnNotify">Enable notifications</button>
    <span style="display:flex;gap:6px">
      <button class="chip on" id="btnSound">Sound on</button>
      <button class="chip" id="btnSpeed" title="Speeds up time so you can test hunger, nagging and digestion quickly">Time ×1</button>
      <button class="chip" id="btnReset">Reset</button>
    </span>
  </div>
  <div class="hint">Draft build · sleep, eat, exercise and fat-shout animations generated from the original frames</div>
</div>

<div class="toast" id="toast"><span id="toastText"></span><button id="toastBtn">Feed</button></div>

<script src="js/game.js"></script>
</body>
</html>
